info:
  name: Delete SKU
  type: graphql
  seq: 13

graphql:
  method: POST
  url: https://localhost/product/api/v2/graphql
  body:
    query: |-
      mutation {
      	deleteSKU(
          SKU: "DS4-W"
        ) {
          id
          name
          description
          category {
            id
            name
          }
          SKUs {
            name
      			SKU
            attributes {
              name
              value
            }
            stock
          }
          createdAt
          createdBy
          updatedAt
          updatedBy
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
