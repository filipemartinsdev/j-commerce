server:
  port: ${PORT:8080}

spring:
  application:
    name: microservice-identity

  profiles:
    active: ${ACTIVE_PROFILE:test}

  data:
    web:
      pageable:
        max-page-size: 20

  datasource:
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 20
      minimum-idle: 2

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://identity:8080/.well-known/jwks.json

  rabbitmq:
    listener:
      direct:
        prefetch: 20
        retry:
          enabled: true
          max-retries: 10
          initial-interval: 2000ms
          multiplier: 2.0

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:test}
      embedding:
        options:
          model: text-embedding-3-small

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info

broker:
  queues:
    createOrder:
      name: order.create_order
    refundItems:
      name: product.refund_items

feign:
  clients:
    sales_order:
      url: http://order:8080