global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'identity-service'
    static_configs:
      - targets: [ 'identity:8080' ]
    metrics_path: '/actuator/prometheus'

  - job_name: 'product-service'
    static_configs:
      - targets: [ 'product:8080' ]
    metrics_path: '/actuator/prometheus'

  - job_name: 'order-service'
    static_configs:
      - targets: [ 'order:8080' ]
    metrics_path: '/actuator/prometheus'

  - job_name: 'notification-service'
    static_configs:
      - targets: [ 'notification:8080' ]
    metrics_path: '/q/metrics'

  - job_name: 'payment-worker'
    static_configs:
      - targets: [ 'payment:8080' ]
    metrics_path: '/q/metrics'

  - job_name: 'identity-db'
    static_configs:
      - targets: [ 'identity_db_scraper:9187' ]
    scrape_interval: 5s

  - job_name: 'cadvisor'
    static_configs:
      - targets: [ 'cadvisor:8080' ]