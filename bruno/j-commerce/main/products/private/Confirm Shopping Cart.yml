info:
  name: Confirm Shopping Cart
  type: graphql
  seq: 14

graphql:
  method: POST
  url: https://localhost/product/api/v2/graphql
  body:
    query: |-
      mutation {
      	confirmShoppingCart(
          deliveryAddressId: "e379d101-0c02-4e58-9e32-75b592fa2e26"
        ) {
      		success
          message
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
