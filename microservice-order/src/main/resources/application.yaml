server:
  port: ${PORT:8080}

spring:
  application:
    name: microservice-identity

  profiles:
    active: ${ACTIVE_PROFILE:test}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://identity:8080/.well-known/jwks.json

  rabbitmq:
    listener:
      simple:
        prefetch: 20
        retry:
          enabled: true
          max-retries: 10
          initial-interval: 2000ms
          multiplier: 2.0

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info

broker:
  exchanges:
    paymentGeneratedFanout:
      name: payment.generated.fanout

    paymentConfirmedFanout:
      name: payment.confirmed.fanout

    orderCancelledFanout:
      name: order.cancelled.fanout

  queues:
    createOrder:
      name: order.create_order

    createShipping:
      name: order.create_shipping

    cancelShipments:
      name: order.cancel_shipments

    generatePayment:
      name: payment.generate_payment

    handlePaymentTimeout:
      name: order.handle_payment_timeout

    confirmOrderPayment:
      name: order.confirm_order_payment

    refundItems:
      name: product.refund_items

    notifyCancelledOrder:
      name: notification.notify_cancelled_order

graphHopperClient:
  apiKey: ${GRAPH_HOPPER_API_KEY:test}