info:
  name: Upload product image
  type: graphql
  seq: 5

graphql:
  method: POST
  url: https://localhost/product/api/v2/graphql
  body:
    query: |-
      mutation {
      	uploadProductImage(
          productId: "6aaeec3353d464ad7aa07e9a"
          contentType: "image/jpeg"
        ) {
          imageId
          uploadURL
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
