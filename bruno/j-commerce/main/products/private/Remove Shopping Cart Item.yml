info:
  name: Remove Shopping Cart Item
  type: graphql
  seq: 12

graphql:
  method: POST
  url: https://localhost/product/api/v2/graphql
  body:
    query: |-
      mutation {
      	removeShoppingCartItem(
          SKU: "sku0"
        ) {
          success
          message
      	}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
