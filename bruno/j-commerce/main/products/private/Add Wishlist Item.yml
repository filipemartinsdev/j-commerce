info:
  name: Add Wishlist Item
  type: graphql
  seq: 7

graphql:
  method: POST
  url: https://localhost/product/api/v2/graphql
  body:
    query: |-
      mutation {
      	addWishlistItem(productId: "") {
          edges {
            node {
              id
              productName
            }
          }
          pageInfo {
            startCursor
            endCursor
            hasPreviousPage
            hasNextPage
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
