server:
  port: ${PORT:8080}

spring:
  application:
    name: microservice-identity

  profiles:
    active: ${ACTIVE_PROFILE:test}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://identity:8080/.well-known/jwks.json

  rabbitmq:
    listener:
      direct:
        prefetch: 20

        retry:
          enabled: true
          max-retries: 3
          multiplier: 2.0

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info

broker:
  exchanges:
    paymentGeneratedFanout:
      name: payment.generated.fanout

    paymentConfirmedFanout:
      name: payment.confirmed.fanout

  queues:
    generatePayment:
      name: payment.generate_payment

    waitPendingPayment:
      name: payment.wait_pending_payment

    notifyPaymentGenerated:
      name: notification.notify_payment_generated

    notifyPaymentConfirmed:
      name: notification.notify_payment_confirmed

    confirmOrderPayment:
      name: order.confirm_order_payment

    handlePaymentTimeout:
      name: order.handle_payment_timeout
