quarkus.http.port=8080

mp.jwt.verify.publickey.location=${AUTH_PUBLIC_KEY_URL}

mp.messaging.connector.smallrye-rabbitmq.host=${RABBITMQ_HOST}
mp.messaging.connector.smallrye-rabbitmq.port=${RABBITMQ_PORT}
mp.messaging.connector.smallrye-rabbitmq.username=${RABBITMQ_USER}
mp.messaging.connector.smallrye-rabbitmq.password=${RABBITMQ_USER}

mp.messaging.incoming.payment-generated.connector=smallrye-rabbitmq
mp.messaging.incoming.payment-generated.queue.name=notification.notify_payment_generated

mp.messaging.incoming.payment-confirmed.connector=smallrye-rabbitmq
mp.messaging.incoming.payment-confirmed.queue.name=notification.notify_payment_confirmed

mp.messaging.incoming.shipping-dispatched.connector=smallrye-rabbitmq
mp.messaging.incoming.shipping-dispatched.queue.name=notification.notify_shipping_dispatched

mp.messaging.incoming.order-cancelled.connector=smallrye-rabbitmq
mp.messaging.incoming.order-cancelled.queue.name=notification.notify_cancelled_order

quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true

quarkus.hibernate-orm.scripts.generation=none
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${PG_NOTIFICATION_URL}
quarkus.datasource.username=${PG_NOTIFICATION_USER:postgres}
quarkus.datasource.password=${PG_NOTIFICATION_PASSWORD:postgres}

quarkus.swagger-ui.always-include=true

