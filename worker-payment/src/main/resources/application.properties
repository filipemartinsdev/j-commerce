quarkus.http.port=8080

# ----- PERSISTENCE -----

quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true

quarkus.hibernate-orm.schema-management.strategy=none

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${PG_URL}
quarkus.datasource.username=${PG_USER:postgres}
quarkus.datasource.password=${PG_PASSWORD:postgres}

# ----- MESSAGING -----

mp.messaging.connector.smallrye-rabbitmq.host=${RABBITMQ_HOST}
mp.messaging.connector.smallrye-rabbitmq.port=${RABBITMQ_PORT}
mp.messaging.connector.smallrye-rabbitmq.username=${RABBITMQ_USER}
mp.messaging.connector.smallrye-rabbitmq.password=${RABBITMQ_PASSWORD}

mp.messaging.incoming.generate-payment.connector=smallrye-rabbitmq
mp.messaging.incoming.generate-payment.queue.name=payment.generate_payment
mp.messaging.incoming.generate-payment.exchange.name=""
mp.messaging.incoming.generate-payment.queue.declare=false

mp.messaging.incoming.handle-payment-timeout.connector=smallrye-rabbitmq
mp.messaging.incoming.handle-payment-timeout.queue.name=payment.handle_payment_timeout
mp.messaging.incoming.handle-payment-timeout.exchange.name=""
mp.messaging.incoming.handle-payment-timeout.queue.declare=false

mp.messaging.incoming.refund-payment.connector=smallrye-rabbitmq
mp.messaging.incoming.refund-payment.queue.name=payment.refund
mp.messaging.incoming.refund-payment.exchange.name=""
mp.messaging.incoming.refund-payment.queue.declare=false

mp.messaging.outgoing.payment-generated.connector=smallrye-rabbitmq
mp.messaging.outgoing.payment-generated.exchange.name=payment.topic
mp.messaging.outgoing.payment-generated.default-routing-key=payment.generated
mp.messaging.outgoing.payment-generated.exchange.type=topic
mp.messaging.outgoing.payment-generated.exchange.declare=false

mp.messaging.outgoing.payment-confirmed.connector=smallrye-rabbitmq
mp.messaging.outgoing.payment-confirmed.exchange.name=payment.topic
mp.messaging.outgoing.payment-confirmed.default-routing-key=payment.confirmed
mp.messaging.outgoing.payment-confirmed.exchange.type=topic
mp.messaging.outgoing.payment-confirmed.exchange.declare=false

mp.messaging.outgoing.payment-timeout.connector=smallrye-rabbitmq
mp.messaging.outgoing.payment-timeout.exchange.name=payment.topic
mp.messaging.outgoing.payment-timeout.default-routing-key=payment.timeout
mp.messaging.outgoing.payment-timeout.exchange.type=topic
mp.messaging.outgoing.payment-timeout.exchange.declare=false

mp.messaging.outgoing.payment-refunded.connector=smallrye-rabbitmq
mp.messaging.outgoing.payment-refunded.exchange.name=payment.topic
mp.messaging.outgoing.payment-refunded.default-routing-key=payment.refunded
mp.messaging.outgoing.payment-refunded.exchange.type=topic
mp.messaging.outgoing.payment-refunded.exchange.declare=false