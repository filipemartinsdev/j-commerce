info:
  name: Catalogue over HTTP
  type: http
  seq: 3

http:
  method: POST
  url: https://localhost/product/api/v2/graphql
  headers:
    - name: Content-Type
      value: application/graphql-response+json
      disabled: true
    - name: Content-Type
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
        "query": "query {\tcatalogue( first: 20 ) { edges { node { id name description category { id name } SKUs { SKU name stock basePrice { label value } currentPrice { label value } attributes { name value } } } } pageInfo { startCursor endCursor hasPreviousPage hasNextPage } }}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
