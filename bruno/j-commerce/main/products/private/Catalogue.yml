info:
  name: Catalogue
  type: graphql
  seq: 2

graphql:
  method: POST
  url: https://localhost/product/api/v2/graphql
  body:
    query: |-
      query {
      	catalogue(
          # categoryId: "2"
          first: 20
          # after: null
        )
        {
          edges {
            node {
              id
              name
              description
              category {
                id
                name
              }
              SKUs {
                SKU
                name
                stock
                basePrice {
                  label
                  value
                }
                currentPrice {
                  label
                  value
                }
                attributes {
                  name
                  value
                }
              }
            }
          }
          pageInfo {
            startCursor
            endCursor
            hasPreviousPage
            hasNextPage
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
