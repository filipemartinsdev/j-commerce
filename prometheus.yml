global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'identity-service'
    static_configs:
      - targets: [ 'identity:8080' ]
    metrics_path: '/actuator/prometheus'

  - job_name: 'products-service'
    static_configs:
      - targets: [ 'products:8080' ]
    metrics_path: '/actuator/prometheus'

  - job_name: 'orders-service'
    static_configs:
      - targets: [ 'orders:8080' ]
    metrics_path: '/actuator/prometheus'

  - job_name: 'notification-service'
    static_configs:
      - targets: [ 'notification:8080' ]
    metrics_path: '/actuator/prometheus'

  - job_name: 'payment-service'
    static_configs:
      - targets: [ 'payment:8080' ]
    metrics_path: '/actuator/prometheus'