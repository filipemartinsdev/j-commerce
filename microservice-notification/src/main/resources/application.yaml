server:
  port: ${PORT:8080}

spring:
  application:
    name: microservice-notification

  profiles:
    active: ${ACTIVE_PROFILE:test}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://identity:8080/.well-known/jwks.json

  rabbitmq:
    listener:
      direct:
        prefetch: 20

        retry:
          enabled: true
          max-retries: 3
          multiplier: 2.0

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info

broker:
  queues:
    notifyPaymentGenerated:
      name: notification.notify_payment_generated

    notifyPaymentConfirmed:
      name: notification.notify_payment_confirmed

    notifyCancelledOrder:
      name: notification.notify_cancelled_order