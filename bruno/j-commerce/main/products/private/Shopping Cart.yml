info:
  name: Shopping Cart
  type: graphql
  seq: 10

graphql:
  method: POST
  url: https://localhost/product/api/v2/graphql
  body:
    query: |-
      query {
      	shoppingCart() {
          totalAmount
          products {
            SKU
            productName
            price
            units
            amount
          }
      	}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
