#      ACTIVE_PROFILE: dev

  notification-v2:
    container_name: notification_service_v2
    build:
      context: microservice-notification-v2/
      dockerfile: Dockerfile.jvm.build
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 600M
    depends_on:
      notification_db:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      PG_NOTIFICATION_URL: jdbc:postgresql://notification_db:5432/postgres
      PG_NOTIFICATION_USER:
      PG_NOTIFICATION_PASSWORD:
      AUTH_PUBLIC_KEY_URL: http://identity:8080/.well-known/jwks.json
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

  payment:
    container_name: payment_service
    build:
      context: microservice-payment/
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 600M
    environment:
      PG_PRODUCT_DATABASE:
      PG_PRODUCT_USER:
      PG_PRODUCT_PASSWORD:
      SPRING_RABBITMQ_ADDRESSES: amqp://admin:admin@rabbitmq:5672/
      SPRING_DATA_REDIS_URL: redis://cache:6379
      ACTIVE_PROFILE: dev

volumes:
  caddy_data:
  caddy_config:
  identity_data:
  product_data:
  order_data:
  cache_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:
  notification_data: