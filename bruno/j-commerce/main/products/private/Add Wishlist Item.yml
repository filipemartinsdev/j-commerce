info:
  name: Add Wishlist Item
  type: graphql
  seq: 7

graphql:
  method: POST
  url: https://localhost/product/api/v2/graphql
  body:
    query: |-
      mutation {
      	addWishlistItem(productId: "6a8ee6f03a24b8efdd5b7f93") {
          success
          message
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
