<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>J-Commerce Login</title>

    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
            integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
            crossorigin="anonymous"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>
<main id="page-content">
    <div class="bg-body-tertiary vh-100 d-flex justify-content-center align-items-center">
        <div class="bg-white border shadow-sm p-5 d-flex justify-content-center align-items-center flex-column border rounded-3 shadow-lg">
            <div class="d-flex justify-content-center align-items-center flex-column">
                <h1 class="mb-5 fs-3 fw-bolder">Login</h1>

                <form method="post" th:action="@{/auth/login}">
                    <div class="mb-3">
                        <label for="input-email" class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" id="input-email" required maxlength="255">
                    </div>

                    <div class="mb-3">
                        <label for="input-password" class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" id="input-password" required maxlength="255">
                    </div>

                    <div>
                        <input type="submit" class="btn btn-dark" value="Login">
                        <a href="/auth/sign-up" class="btn ">Sign-up</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
