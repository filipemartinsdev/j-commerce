info:
  name: get notifications
  type: http
  seq: 1

http:
  method: GET
  url: https://localhost/notification/api/v2/notifications?page=&size=&sort=createdAt,ASC
  params:
    - name: page
      value: ""
      type: query
    - name: size
      value: ""
      type: query
    - name: sort
      value: createdAt,ASC
      type: query
    - name: viewed
      value: "true"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
