info:
  name: Add Shopping Cart Item
  type: graphql
  seq: 10

graphql:
  method: POST
  url: https://localhost/product/api/v2/graphql
  body:
    query: |-
      mutation {
      	addShoppingCartItem(
          SKU: "sku0"
          units: 1
        ) {
          success
          message
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
