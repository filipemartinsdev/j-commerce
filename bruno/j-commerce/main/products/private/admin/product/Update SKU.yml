info:
  name: Update SKU
  type: graphql
  seq: 12

graphql:
  method: POST
  url: https://localhost/product/api/v2/graphql
  body:
    query: |-
      mutation {
      	updateSKU(
          SKU: "DS4-W"
          request: {
            name: "Dualshok 4 white"
            attributes: [
              {name: "color", value: "white"}
            ]
          }
        ) {
          id
          name
          description
          category {
            id
            name
          }
          SKUs {
            name
      			SKU
            attributes {
              name
              value
            }
            stock
          }
          createdAt
          createdBy
          updatedAt
          updatedBy
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
